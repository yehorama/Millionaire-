<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12042f">
<title>מי רוצה להיות מיליונר?</title>
<style>
:root{--bg:#10002e;--bg2:#26005e;--blue:#071c4b;--blue2:#0d347d;--cyan:#00b8ff;--gold:#ffd34e;--green:#21e55a;--orange:#ff9e21;--red:#ff273b;--white:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 70%,#4b10a5 0,#1c034a 42%,#09001f 100%);color:#fff;font-family:Arial,"Noto Sans Hebrew",sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 105%,rgba(140,50,255,.45),transparent 35%);opacity:.8}
button,input{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.screen{width:min(1100px,100%);display:none}
.screen.active{display:block}
.card{background:linear-gradient(145deg,rgba(8,26,68,.94),rgba(5,12,39,.96));border:1px solid rgba(0,184,255,.8);box-shadow:0 0 30px rgba(0,170,255,.18),inset 0 0 30px rgba(0,70,180,.12);border-radius:24px}
.start{max-width:900px;margin:auto;text-align:center;padding:28px}
.logo{font-weight:900;font-size:clamp(42px,9vw,92px);line-height:.9;color:#ffd84d;text-shadow:0 3px 0 #8a4c00,0 0 22px rgba(255,210,60,.5);margin:18px 0 8px}
.subtitle{font-size:clamp(18px,3vw,28px);color:#fff;margin-bottom:28px}
.goldBtn{border:2px solid #ffe36b;background:linear-gradient(#ffe46a,#ffae0b);color:#241000;font-weight:900;padding:14px 38px;border-radius:999px;box-shadow:0 0 24px rgba(255,200,40,.4);font-size:22px}
.goldBtn:active,.answer:active,.life:active{transform:scale(.98)}
.nameBox{display:flex;gap:10px;justify-content:center;margin:22px auto;max-width:520px}
.nameBox input{flex:1;min-width:0;background:#071534;color:#fff;border:2px solid #079cf0;border-radius:14px;padding:14px 16px;outline:none;text-align:right}
.leaders{max-width:520px;margin:18px auto 26px;padding:14px}
.leaders h2{margin:0 0 10px;color:#ffd34e}
.leader{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.12)}
.leader:last-child{border:0}
.game{display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start}
.main{padding:18px}
.sidebar{padding:12px}
.header{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.badge{padding:8px 12px;border:1px solid #138fff;border-radius:999px;background:#061941;color:#8fdcff}
.stage{font-weight:900}
.timerWrap{position:relative;height:18px;background:#06132e;border:1px solid #157bc4;border-radius:999px;overflow:hidden;margin:10px 0 16px}
.timerBar{height:100%;width:100%;background:linear-gradient(90deg,#19e85a,#b8ff45);transition:width .1s linear,background .3s}
.timerBar.orange{background:linear-gradient(90deg,#ffca34,#ff8d13)}
.timerBar.red{background:linear-gradient(90deg,#ff5a4d,#ff142d);box-shadow:0 0 14px rgba(255,30,50,.65)}
.timerNum{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:900;text-shadow:0 1px 4px #000}
.question{font-size:clamp(21px,3vw,34px);line-height:1.35;text-align:center;padding:20px 18px;border:1px solid #0b9df3;border-radius:20px;background:linear-gradient(145deg,#0a285f,#061330);box-shadow:inset 0 0 25px rgba(0,110,220,.14);min-height:105px;display:flex;align-items:center;justify-content:center}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.answer{border:2px solid #079cf0;background:linear-gradient(180deg,#0b326f,#071735);color:#fff;border-radius:18px;padding:14px 18px;text-align:right;min-height:70px;transition:.18s;box-shadow:inset 0 0 18px rgba(0,80,190,.12)}
.answer:hover{background:linear-gradient(180deg,#10448e,#09224d)}
.answer .letter{color:#67d4ff;font-weight:900;margin-left:8px}
.answer.selected{border-color:#ffd23f;background:linear-gradient(180deg,#244d83,#112a55)}
.answer.correct{border-color:#2cff5c;background:linear-gradient(180deg,#0c8739,#075526);box-shadow:0 0 22px rgba(35,255,80,.25)}
.answer.wrong{border-color:#ff3448;background:linear-gradient(180deg,#8b1d2c,#4a0c16)}
.answer.hidden{visibility:hidden;pointer-events:none}
.lifelines{display:flex;justify-content:center;gap:12px;margin-top:16px}
.life{width:82px;height:58px;border-radius:18px;border:2px solid #159fff;background:#061a43;color:#fff;font-weight:900;box-shadow:0 0 12px rgba(0,150,255,.15)}
.life.used{opacity:.25;filter:grayscale(1);pointer-events:none}
.money{display:flex;flex-direction:column;gap:4px}
.moneyRow{height:34px;display:flex;align-items:center;justify-content:center;border:1px solid #2c80c9;border-radius:18px;background:linear-gradient(180deg,#153c77,#091b43);font-size:16px;font-weight:700}
.moneyRow.current{background:linear-gradient(180deg,#ffd84f,#e69b12);color:#1a0d00;border-color:#fff1a3;box-shadow:0 0 16px rgba(255,205,50,.55)}
.moneyRow.done{opacity:.35}
.moneyRow.million{font-size:19px;border-color:#ffe36b}
.transition,.result{position:fixed;inset:0;background:radial-gradient(circle,#25006b 0,#0a0022 80%);display:flex;align-items:center;justify-content:center;z-index:20;text-align:center;padding:20px}
.transitionBox,.resultBox{max-width:650px;padding:40px;border-radius:30px;border:2px solid #00b8ff;background:linear-gradient(145deg,#071c4d,#10032f);box-shadow:0 0 60px rgba(0,180,255,.25);animation:pop .45s ease}
.transitionBox h1,.resultBox h1{color:#ffd34e;font-size:clamp(38px,8vw,72px);margin:0 0 10px}
.transitionBox p,.resultBox p{font-size:22px}
.hiddenUI{display:none!important}
.fire{font-size:60px;animation:pulse .8s infinite alternate}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{to{transform:scale(1.12)}}
.audience{padding:20px;text-align:center}
.bars{display:flex;align-items:flex-end;justify-content:center;gap:14px;height:210px;margin:20px 0}
.barCol{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;width:20%}
.bar{width:70%;min-height:8px;border-radius:10px 10px 0 0;background:#149ff5;box-shadow:0 0 12px rgba(0,170,255,.25)}
.bar.best{background:#2bf15d}
.barLabel{font-weight:900}.pct{font-weight:900}
.note{font-size:14px;color:#b9d9ff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#061737;border:1px solid #19a9ff;padding:12px 18px;border-radius:999px;z-index:50;box-shadow:0 0 20px rgba(0,150,255,.25)}
@media(max-width:820px){
 .app{padding:10px}.game{grid-template-columns:1fr}.sidebar{order:-1}.money{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.moneyRow{font-size:11px;height:30px}.moneyRow.million{font-size:12px}.main{padding:12px}.answers{gap:8px}.answer{min-height:62px;padding:11px 10px}.life{width:74px;height:52px}.question{min-height:95px}
}
@media(max-width:500px){.answers{grid-template-columns:1fr}.header{font-size:13px}.money{grid-template-columns:repeat(3,1fr)}.moneyRow.current{order:-1}.lifelines{gap:7px}.life{width:31%;font-size:12px}}
</style>
</head>
<body>
<div class="app">
<section id="startScreen" class="screen active">
 <div class="card start">
   <div class="logo">מיליונר</div>
   <div class="subtitle">מי רוצה להיות מיליונר?</div>
   <div id="leaders" class="leaders"></div>
   <button class="goldBtn" id="startBtn">התחל משחק</button>
 </div>
</section>

<section id="nameScreen" class="screen">
 <div class="card start">
  <div class="logo" style="font-size:clamp(38px,8vw,70px)">מיליונר</div>
  <h2>מה השם שלך?</h2>
  <div class="nameBox"><input id="nameInput" maxlength="24" placeholder="הכנס שם..." autocomplete="name"><button class="goldBtn" id="nameBtn">התחל</button></div>
  <div class="note">השם יוצג בטבלת אלופי המיליונר במקרה של זכייה במיליון.</div>
 </div>
</section>

<section id="gameScreen" class="screen">
 <div class="game">
  <div class="card main">
   <div class="header">
    <div class="badge" id="questionCounter">שאלה 1 מתוך 15</div>
    <div class="badge stage" id="stageLabel">שלב 1 · קל</div>
    <div class="badge" id="currentPrize">₪500</div>
   </div>
   <div class="timerWrap"><div id="timerBar" class="timerBar"></div><div id="timerNum" class="timerNum">30</div></div>
   <div id="question" class="question"></div>
   <div id="answers" class="answers"></div>
   <div class="lifelines">
    <button class="life" id="fifty">50:50</button>
    <button class="life" id="audience">👥<br>קהל</button>
    <button class="life" id="swap">🔄<br>החלף</button>
   </div>
  </div>
  <aside class="card sidebar"><div id="money" class="money"></div></aside>
 </div>
</section>
</div>

<div id="overlay" class="transition hiddenUI"><div id="overlayBox" class="transitionBox"></div></div>
<div id="audienceOverlay" class="transition hiddenUI">
 <div class="transitionBox audience">
  <h1>👥 עזרת הקהל</h1>
  <div id="audienceBars" class="bars"></div>
  <p id="audienceText"></p>
  <button class="goldBtn" id="closeAudience">חזרה לשאלה</button>
 </div>
</div>
<div id="toast" class="toast hiddenUI"></div>

let game = {
 name:"", index:0, current:null, used:{fifty:false,audience:false,swap:false},
 timer:null, startedAt:0, locked:false, questionPool:[],
};
let audioCtx = null;

const $ = id => document.getElementById(id);
function money(n){ return "₪" + n.toLocaleString("he-IL"); }
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active")); $(id).classList.add("active"); }
function toast(msg){ $("toast").textContent=msg; $("toast").classList.remove("hiddenUI"); setTimeout(()=> $("toast").classList.add("hiddenUI"),1800); }

function beep(freq=440,dur=.12,type="sine",vol=.035){
 try{
  audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);
  o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur);
 }catch(e){}
}
function tension(){
 beep(330,.09,"sawtooth",.025); setTimeout(()=>beep(440,.09,"sawtooth",.025),120);
}
function shuffle(arr){ return [...arr].sort(()=>Math.random()-.5); }

function loadLocalLeaders(){
 try{return JSON.parse(localStorage.getItem("millionLeaders")||"[]")}catch(e){return []}
}
async function getLeaders(){
 if(SUPABASE_URL.startsWith("YOUR_")) return loadLocalLeaders();
 try{
  const r=await fetch(SUPABASE_URL+"/rest/v1/leaders?select=name,wins&order=wins.desc&limit=5",{headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPABASE_ANON_KEY}});
  if(!r.ok) throw new Error();
  return await r.json();
 }catch(e){ return loadLocalLeaders(); }
}
async function renderLeaders(){
 const data=await getLeaders();
 $("leaders").innerHTML="<h2>🏆 אלופי המיליונר</h2>"+(data.length?data.map((x,i)=>`<div class="leader"><span>${i+1}. ${escapeHtml(x.name)}</span><b>${x.wins}</b></div>`).join(""):"<div class='note'>עדיין אין זוכים. תהיה הראשון!</div>");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}

async function recordWin(name){
 if(SUPABASE_URL.startsWith("YOUR_")){
  const d=loadLocalLeaders(); const row=d.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(row) row.wins++; else d.push({name,wins:1});
  d.sort((a,b)=>b.wins-a.wins||a.name.localeCompare(b.name)); localStorage.setItem("millionLeaders",JSON.stringify(d.slice(0,50))); return true;
 }
 try{
  const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/record_million_win",{method:"POST",headers:{"Content-Type":"application/json",apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPABASE_ANON_KEY},body:JSON.stringify({player_name:name})});
  if(!r.ok) throw new Error();
  return true;
 }catch(e){ toast("לא הצלחתי לעדכן את הטבלה המקוונת"); return false; }
}

function buildPool(){
 const used = new Set();
 game.questionPool = [[],[],[]];
 QUESTIONS.forEach((q,i)=>game.questionPool[q.difficulty??(i<30?0:i<60?1:2)].push({...q,id:i}));
 // Prefer no duplicate category in consecutive picks when possible.
 game.questionPool = game.questionPool.map(arr=>shuffle(arr));
}
function pickQuestion(stage){
 const pool=game.questionPool[stage];
 let candidates=pool.filter(q=>!game.usedIds?.has(q.id));
 if(!candidates.length){game.usedIds ||= new Set(); pool.forEach(q=>game.usedIds.delete(q.id)); candidates=pool}
 const q=candidates[Math.floor(Math.random()*candidates.length)];
 game.usedIds ||= new Set(); game.usedIds.add(q.id);
 return q;
}
function stageFor(i){return i<5?0:i<10?1:2;}
function stageName(s){return ["שלב 1 · קל","שלב 2 · בינוני","שלב 3 · קשה"][s];}

function renderMoney(){
 $("money").innerHTML=PRIZES.map((p,i)=>{
  const cls=(i===game.index?"current ":"")+(i===14?"million ":"")+(i<game.index?"done":"");
  return `<div class="moneyRow ${cls}">${money(p)}</div>`;
 }).reverse().join("");
}
function prepareQuestion(){
 game.locked=false;
 const s=stageFor(game.index);
 game.current=pickQuestion(s);
 const opts=game.current.a.map((text,i)=>({text,correct:i===game.current.c}));
 const shuffled=shuffle(opts);
 game.current.opts=shuffled;
 $("stageLabel").textContent=stageName(s);
 $("questionCounter").textContent=`שאלה ${game.index+1} מתוך 15`;
 $("currentPrize").textContent=money(PRIZES[game.index]);
 $("question").textContent=game.current.q;
 $("answers").innerHTML=shuffled.map((o,i)=>`<button class="answer" data-i="${i}"><span class="letter">${["א","ב","ג","ד"][i]}.</span>${escapeHtml(o.text)}</button>`).join("");
 document.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.i)));
 renderMoney();
 startTimer();
}
function startTimer(){
 clearInterval(game.timer); game.startedAt=Date.now(); updateTimer();
 game.timer=setInterval(updateTimer,100);
}
function updateTimer(){
 const elapsed=(Date.now()-game.startedAt)/1000, left=Math.max(0,30-elapsed);
 $("timerNum").textContent=Math.ceil(left);
 const bar=$("timerBar"); bar.style.width=(left/30*100)+"%";
 bar.classList.toggle("orange",left<=15 && left>7); bar.classList.toggle("red",left<=7);
 if(left<=7 && left>6.8) tension();
 if(left<=0){clearInterval(game.timer); finish(false,"נגמר הזמן!");}
}
function answer(i){
 if(game.locked)return;
 game.locked=true; clearInterval(game.timer);
 const btns=[...document.querySelectorAll(".answer")];
 const chosen=game.current.opts[i];
 btns[i].classList.add("selected");
 setTimeout(()=>{
  const correctIndex=game.current.opts.findIndex(o=>o.correct);
  btns[correctIndex].classList.add("correct");
  if(!chosen.correct) btns[i].classList.add("wrong");
  chosen.correct ? beep(700,.2,"sine",.05) : beep(120,.3,"sawtooth",.05);
  setTimeout(()=>chosen.correct ? nextQuestion() : finish(false,"התשובה אינה נכונה"),900);
 },450);
}
function nextQuestion(){
 game.index++;
 if(game.index===5){showStage(2,"שלב 1 הושלם!","עוברים לשלב הבינוני");return;}
 if(game.index===10){showStage(2,"שלב 2 הושלם!","עכשיו מגיע השלב הקשה");return;}
 if(game.index>=15){win();return;}
 prepareQuestion();
}
function showStage(ms,title,text){
 $("overlayBox").innerHTML=`<div class="fire">${ms===2?"✨":"🔥"}</div><h1>${title}</h1><p>${text}</p>`;
 $("overlay").classList.remove("hiddenUI"); beep(660,.16); setTimeout(()=>beep(880,.18),180);
 setTimeout(()=>{$("overlay").classList.add("hiddenUI");prepareQuestion()},2200);
}
function finish(winFlag,reason){
 clearInterval(game.timer); game.locked=true;
 $("overlayBox").innerHTML=`<h1>${winFlag?"🎉 מיליון!":"❌ המשחק הסתיים"}</h1><p>${winFlag?"כל הכבוד! הגעת ל־₪1,000,000":escapeHtml(reason)}</p><p>${winFlag?"השם שלך נכנס לטבלת אלופי המיליונר.":"הגעת עד " + money(game.index?PRIZES[Math.max(0,game.index-1)]:0)}</p><button class="goldBtn" id="backHome">חזרה למסך הראשי</button>`;
 $("overlay").classList.remove("hiddenUI");
 $("backHome").onclick=()=>{ $("overlay").classList.add("hiddenUI"); show("startScreen"); renderLeaders(); };
}
async function win(){
 clearInterval(game.timer); game.locked=true; beep(523,.18);setTimeout(()=>beep(659,.18),180);setTimeout(()=>beep(784,.35),360);
 await recordWin(game.name);
 $("overlayBox").innerHTML=`<div class="fire">🏆</div><h1>מזל טוב!</h1><p>הגעת למיליון!</p><p style="color:#ffd34e;font-size:32px;font-weight:900">₪1,000,000</p><button class="goldBtn" id="backHome">חזרה למסך הראשי</button>`;
 $("overlay").classList.remove("hiddenUI");
 $("backHome").onclick=()=>{ $("overlay").classList.add("hiddenUI"); show("startScreen"); renderLeaders(); };
}

function useFifty(){
 if(game.used.fifty||game.locked)return;game.used.fifty=true;$("fifty").classList.add("used");
 const wrong=[...document.querySelectorAll(".answer")].filter((b,i)=>!game.current.opts[i].correct);
 shuffle(wrong).slice(0,2).forEach(b=>b.classList.add("hidden")); beep(520,.12);
}
function useAudience(){
 if(game.used.audience||game.locked)return;game.used.audience=true;$("audience").classList.add("used");
 const correct=game.current.opts.findIndex(o=>o.correct), vals=[0,0,0,0];
 const stage=stageFor(game.index);
 const correctBase=stage===0?72:stage===1?61:stage===2?46:61;
 let remaining=100-correctBase;
 for(let i=0;i<4;i++) if(i!==correct){const share=Math.random(); vals[i]=share;remaining-=0}
 let weights=vals.map(()=>Math.random()); const sum=weights.reduce((a,b)=>a+b,0);
 for(let i=0;i<4;i++) if(i!==correct) vals[i]=Math.floor(remaining*weights[i]/sum);
 vals[correct]=100-vals.filter((_,i)=>i!==correct).reduce((a,b)=>a+b,0);
 // Hard questions occasionally fool the audience.
 if(stage===2 && Math.random()<.18){
  const wrong=(correct+1+Math.floor(Math.random()*3))%4; const shift=Math.min(vals[correct]-8,10);
  if(shift>0){vals[correct]-=shift;vals[wrong]+=shift;}
 }
 $("audienceBars").innerHTML=vals.map((v,i)=>`<div class="barCol"><div class="pct">${v}%</div><div class="bar ${i===correct?"best":""}" style="height:${Math.max(8,v*1.7)}px"></div><div class="barLabel">${["א","ב","ג","ד"][i]}</div></div>`).join("");
 const max=Math.max(...vals), lead=vals[correct]===max?"רוב הקהל בחר בתשובה הנכונה.":"הקהל חלוק — אין תשובה עם רוב ברור.";
 $("audienceText").textContent=lead;
 $("audienceOverlay").classList.remove("hiddenUI");beep(520,.12);
}
function useSwap(){
 if(game.used.swap||game.locked)return;game.used.swap=true;$("swap").classList.add("used");clearInterval(game.timer);beep(430,.12);
 prepareQuestion();
}

$("startBtn").onclick=()=>{show("nameScreen");setTimeout(()=>$("nameInput").focus(),100)};
$("nameBtn").onclick=()=>{
 const n=$("nameInput").value.trim();
 if(n.length<2){toast("נא להכניס שם");return}
 game={name:n,index:0,current:null,used:{fifty:false,audience:false,swap:false},timer:null,startedAt:0,locked:false,questionPool:[],usedIds:new Set()};
 buildPool(); show("gameScreen"); prepareQuestion();
};
$("nameInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("nameBtn").click()});
$("fifty").onclick=useFifty;$("audience").onclick=useAudience;$("swap").onclick=useSwap;
$("closeAudience").onclick=()=>{$("audienceOverlay").classList.add("hiddenUI")};
renderLeaders();
</script>
</body>
</html>
